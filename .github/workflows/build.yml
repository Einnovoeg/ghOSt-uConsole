name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support \
            kpartx parted gdisk dosfstools xz-utils bmap-tools \
            device-tree-compiler rsync u-boot-tools git curl python3 \
            crossbuild-essential-arm64 gcc-aarch64-linux-gnu
          sudo systemctl restart binfmt-support || true
          df -h

      - name: Shellcheck + bash syntax
        run: |
          bash -n build.sh
          bash -n kernel/build-kernel.sh
          bash -n image/pack-image.sh
          bash -n patches/kernel/verify-pi-boot.sh
          for s in rootfs/stages/*.sh; do bash -n "$s"; done

      - name: Stage kernel boot assets
        run: |
          mkdir -p build/kernel
          sudo bash kernel/build-kernel.sh
          ls -lh build/kernel/boot-firmware/ || ls -lh kernel/boot/

      - name: Build staged rootfs (bootable minimal)
        run: |
          sudo rm -rf build/rootfs
          sudo bash rootfs/stages/00-debootstrap.sh build/rootfs
          sudo bash rootfs/stages/10-base-pkgs.sh build/rootfs
          sudo bash rootfs/stages/20-desktop.sh build/rootfs
          sudo bash rootfs/stages/30-handheld.sh build/rootfs
          sudo bash rootfs/stages/40-network.sh build/rootfs
          sudo bash rootfs/stages/50-overlay.sh build/rootfs overlay
          # Install staged Pi boot firmware config into rootfs FAT view
          # (kernel stage outputs to build/kernel/boot-firmware/)
          sudo mkdir -p build/rootfs/boot/firmware
          sudo cp -a build/kernel/boot-firmware/. build/rootfs/boot/firmware/ 2>/dev/null || true
          ls -lh build/rootfs/boot/firmware/ || true
          # Run ghOSt in-chroot configuration (mounted, chrooted — never directly on runner)
          sudo mount --bind /dev build/rootfs/dev || true
          sudo mount --bind /proc build/rootfs/proc || true
          sudo mount --bind /sys build/rootfs/sys || true
          sudo cp /etc/resolv.conf build/rootfs/etc/resolv.conf || true
          sudo chroot build/rootfs /bin/bash /opt/ghost/scripts/configure.sh 2>&1 | tail -30 || echo "[warn] configure.sh warnings (continuing)"
          sudo umount -l build/rootfs/sys build/rootfs/proc build/rootfs/dev 2>/dev/null || true
          # Re-copy staged boot config (configure.sh may touch /boot) then verify
          sudo cp -a build/kernel/boot-firmware/. build/rootfs/boot/firmware/ 2>/dev/null || true
          sudo bash patches/kernel/verify-pi-boot.sh build/rootfs
          sudo bash rootfs/stages/99-cleanup.sh build/rootfs

      - name: Pack image (bmap+xz)
        run: |
          df -h
          sudo bash image/pack-image.sh build dist 2>&1 || sudo bash image/pack-image.sh "$(pwd)/build" "$(pwd)/dist"
          ls -lh dist/

      - name: Compute checksums
        run: |
          sudo chown -R "$(whoami)" dist/ || true
          cd dist
          sha256sum *.img.xz *.bmap > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghost-uconsole-image
          path: dist/*
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ghost-uconsole-image
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
